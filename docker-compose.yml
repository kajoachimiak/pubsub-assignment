services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"

  pubsub-init:
    image: curlimages/curl
    depends_on:
      - pubsub-emulator
    command: >
      sh -c "
        sleep 5 &&
        curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/local-assignment-project/topics/orders.transformed' &&
        curl -s -X PUT 'http://pubsub-emulator:8085/v1/projects/local-assignment-project/topics/orders.failed' &&
        echo 'Topics created successfully'
      "

  app:
    build: .
    image: pubsub-assignment:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_GCP_PROJECT_ID=local-assignment-project
      - SPRING_CLOUD_GCP_PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      - APP_PUBSUB_OUTPUT_TOPIC=orders.transformed
    depends_on:
      - pubsub-emulator
      - pubsub-init