spring:
  application:
    name: assignment
  cloud:
    gcp:
      project-id: local-assignment-project
      pubsub:
        emulator-host: localhost:8085

app:
  pubsub:
    input-subscription: orders.ubl.received
    output-topic: orders.transformed
    failed-topic: orders.failed
    retry:
      max-attempts: 3
      backoff-ms: 1000

logging:
  level:
    com.pubsub.assignment: DEBUG
    org.springframework.web: INFO
  structured:
    format:
      console: ecs

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Disabled: spring-cloud-gcp-starter-pubsub 4.1.1's PubSubHealthIndicatorAutoConfiguration
    # is binary-incompatible with Spring Boot 3.4.2's Actuator (NoSuchMethodError on
    # CompositeHealthContributorConfiguration's no-arg constructor), which crashes the
    # application context on startup if enabled.
    pubsub:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,metrics